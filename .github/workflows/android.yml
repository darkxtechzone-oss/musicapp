name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (full log saved to file)
        run: |
          set -o pipefail
          ./gradlew :composeApp:assembleDebug --stacktrace --no-configuration-cache 2>&1 | tee gradle-full-log.txt

      - name: Show real error if build failed
        if: failure()
        run: |
          echo "===== LAST 200 LINES OF GRADLE LOG (likely contains the real cause) ====="
          tail -n 200 gradle-full-log.txt
          echo "=========================================================================="
          echo "### ❌ Build failed — see full log below or download the 'gradle-full-log' artifact" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 200 gradle-full-log.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload full Gradle log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-full-log
          path: gradle-full-log.txt
          if-no-files-found: warn

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
